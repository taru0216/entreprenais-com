<!DOCTYPE html>
<!--

  /products/ecobot-ai/ に移動した。旧パス /products/green-ai-staff/ への
  既存アクセス（外部リンク・ブックマーク・過去のSNSシェアURL・検索エンジン
  インデックス）を404にせず新URLへ誘導するための静的リダイレクトページ。
  GitHub Pages は静的ホスティングのためサーバーサイドリダイレクト
  （301等）は使えず、redirect-cloud.html と同じ
  meta refresh + JS + canonical タグ方式で代替する。
-->
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="refresh" content="0; url=https://entreprenais.com/products/ecobot-ai/" />
  <link rel="canonical" href="https://entreprenais.com/products/ecobot-ai/" />
  <meta name="robots" content="noindex,follow" />
  <title>エコボットAI（旧グリーンAIスタッフ） | EntreprenAIs</title>
  <meta property="og:title" content="エコボットAI（旧グリーンAIスタッフ） | EntreprenAIs" />
  <meta property="og:image" content="https://entreprenais.com/og.png" />
  <script>
    location.replace('https://entreprenais.com/products/ecobot-ai/' + location.hash);
  </script>
</head>
<body>
  <p>このページ（旧「グリーンAIスタッフ」）は <a href="https://entreprenais.com/products/ecobot-ai/">https://entreprenais.com/products/ecobot-ai/</a>（エコボットAI）に移動しました。自動的に転送されない場合はリンクをクリックしてください。</p>
</body>
</html>
