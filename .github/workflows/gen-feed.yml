name: Generate feed.xml

on:
  push:
    branches:
      - main
    paths:
      - "data/news.json"
      - "scripts/gen-feed.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gen-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate feed.xml
        run: python3 scripts/gen-feed.py > feed.xml

      - name: Commit feed.xml if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed.xml
          if git diff --cached --quiet; then
            echo "feed.xml is unchanged, skipping commit"
          else
            git commit -m "chore: regenerate feed.xml from news.json [skip ci]"
            git push
          fi
