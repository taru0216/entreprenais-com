name: Deploy cloud

on:
  push:
    branches: [main]
    paths:
      - 'cloud-src/**'
      - '.github/workflows/deploy-cloud.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: cloud-src/package-lock.json

      - name: Build cloud
        working-directory: cloud-src
        run: npm ci && npm run build
        env:
          ASTRO_BASE: /cloud

      - name: Assemble full site
        run: |
          mkdir -p _site/cloud
          # Root static files
          find . -maxdepth 1 -type f \( -name "*.html" -o -name "*.css" -o -name "*.js" \
            -o -name "*.xml" -o -name "*.txt" -o -name "*.ico" -o -name "*.svg" \
            -o -name "*.png" -o -name "*.webmanifest" -o -name "_headers" \) \
            -exec cp {} _site/ \;
          # Root directories
          for dir in img en zh news eai privacy terms data _i18n; do
            [ -d "$dir" ] && cp -r "$dir" _site/
          done
          # sites/* — copy non-Astro (static HTML) sites as-is.
          # Astro source projects (identified by presence of package.json) are
          # skipped here: their own deploy-<name>.yml builds and places the
          # compiled dist/ output, so copying the raw source would publish
          # unbuilt config/src files instead. This auto-detection (rather than
          # an explicit allowlist) stays correct as new sites/* are added
          # without needing to update this workflow (#303 COO plan review).
          if [ -d sites ]; then
            for site in sites/*/; do
              name=$(basename "$site")
              if [ -f "${site}package.json" ]; then
                continue
              fi
              mkdir -p "_site/sites/$name"
              cp -r "$site"/* "_site/sites/$name/" 2>/dev/null || true
            done
          fi
          # cloud Astro build → top-level /cloud (not under sites/, per FC-specified URL entreprenais.com/cloud)
          cp -r cloud-src/dist/. _site/cloud/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
