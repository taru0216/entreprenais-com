name: Deploy main site

# Single unified workflow for all GitHub Pages content (#303 hotfix).
#
# Background: this repo previously had per-site workflows
# (deploy-taruishi-burger.yml / deploy-banwaen-ikebukuro.yml / deploy-cloud.yml)
# that each independently called actions/upload-pages-artifact. Each run fully
# replaces the previous Pages deployment, so whichever per-site workflow ran
# last would publish only its own site + non-Astro static sites, silently
# 404-ing the other Astro subsites (they can't copy each other's *unbuilt*
# source, and don't retain each other's *built* dist/ across separate runs).
# This was latent since banwaen-ikebukuro was added and got exposed when
# cloud-src was added (#303). Consolidating into one workflow that always
# builds every Astro subsite together removes the possibility of a partial
# deployment entirely — there is no longer a "last writer wins" race between
# sites, because there is only one writer.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: sites/banwaen-ikebukuro/package-lock.json

      - name: Build banwaen-ikebukuro
        working-directory: sites/banwaen-ikebukuro
        run: npm ci && npm run build
        env:
          ASTRO_BASE: /sites/banwaen-ikebukuro

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: sites/taruishi-burger/package-lock.json

      - name: Build taruishi-burger
        working-directory: sites/taruishi-burger
        run: npm ci && npm run build
        env:
          ASTRO_BASE: /sites/taruishi-burger

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: cloud-src/package-lock.json

      - name: Build cloud
        working-directory: cloud-src
        run: npm ci && npm run build
        env:
          ASTRO_BASE: /cloud

      - name: Assemble full site
        run: |
          mkdir -p _site
          # Root static files
          find . -maxdepth 1 -type f \( -name "*.html" -o -name "*.css" -o -name "*.js" \
            -o -name "*.xml" -o -name "*.txt" -o -name "*.ico" -o -name "*.svg" \
            -o -name "*.png" -o -name "*.webmanifest" -o -name "_headers" \) \
            -exec cp {} _site/ \;
          # Root directories (static content) — vertical/ added for #274, agents/ added for /agents/ product page
          for dir in img en zh news eai agents privacy terms data _i18n vertical; do
            [ -d "$dir" ] && cp -r "$dir" _site/
          done
          # Astro subsites (built output)
          mkdir -p _site/sites/banwaen-ikebukuro _site/sites/taruishi-burger _site/cloud
          cp -r sites/banwaen-ikebukuro/dist/. _site/sites/banwaen-ikebukuro/
          cp -r sites/taruishi-burger/dist/. _site/sites/taruishi-burger/
          cp -r cloud-src/dist/. _site/cloud/
          # Other sites (non-Astro static HTML). Astro source dirs are detected
          # automatically via package.json presence and skipped here — they are
          # already built and placed above. This keeps the loop correct as new
          # sites/* are added without needing to list them explicitly (#303).
          for site in sites/*/; do
            name=$(basename "$site")
            if [ -f "${site}package.json" ]; then
              continue
            fi
            mkdir -p "_site/sites/$name"
            cp -r "$site"/* "_site/sites/$name/" 2>/dev/null || true
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
