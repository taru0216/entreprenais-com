<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0d0f12" />
  <meta name="robots" content="index,follow" />
  <title>ニュース | EntreprenAIs</title>
  <meta name="description" content="EntreprenAIs — 樽石デジタル技術研究所合同会社（TDRI）からの最新ニュース・プレスリリース。" />
  <link rel="canonical" href="https://entreprenais.com/news/" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="ja_JP" />
  <meta property="og:site_name" content="EntreprenAIs / 樽石デジタル技術研究所合同会社" />
  <meta property="og:url" content="https://entreprenais.com/news/" />
  <meta property="og:title" content="ニュース | EntreprenAIs" />
  <meta property="og:description" content="EntreprenAIs — 樽石デジタル技術研究所合同会社（TDRI）からの最新ニュース・プレスリリース。" />
  <meta property="og:image" content="https://entreprenais.com/og.png" />

  <!-- Favicons -->
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />

  <style>
    /* News index page styles */
    .news-index {
      padding: 8rem var(--gutter) 6rem;
      background: var(--paper);
    }
    .news-index__inner {
      max-width: var(--max);
      margin: 0 auto;
    }
    .news-index__back {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-family: var(--serif);
      font-size: 0.82rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 3rem;
      transition: color 0.2s var(--ease);
      text-decoration: none;
    }
    .news-index__back:hover {
      color: var(--accent);
    }
    .news-index__back::before {
      content: "←";
      font-size: 1em;
    }
    .news-index__eyebrow {
      font-family: var(--serif);
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.34em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 1.5rem;
    }
    .news-index__title {
      font-family: var(--jp);
      font-weight: 700;
      font-size: clamp(2rem, 4.5vw, 3.2rem);
      line-height: 1.25;
      letter-spacing: -0.005em;
      margin: 0 0 4rem;
      color: var(--ink);
    }
    .news-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    .news-card {
      position: relative;
      background: var(--paper);
      border: 1px solid var(--line-soft);
      border-radius: 22px;
      padding: 1.6rem 2rem;
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      gap: 1.6rem;
      text-decoration: none;
      color: inherit;
      transition: transform 0.4s var(--ease), border-color 0.4s var(--ease), box-shadow 0.4s var(--ease);
    }
    .news-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 1.6rem;
      right: 1.6rem;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent-bright), transparent);
      border-radius: 999px;
      opacity: 0;
      transition: opacity 0.4s var(--ease);
    }
    .news-card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
      box-shadow: 0 18px 42px -22px rgba(42, 45, 124, 0.30);
    }
    .news-card:hover::before {
      opacity: 0.85;
    }
    .news-card__meta {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .news-card__date {
      font-family: var(--serif);
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      color: var(--muted);
    }
    .news-card__badge {
      display: inline-block;
      font-family: var(--serif);
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
      background: rgba(42, 45, 124, 0.08);
      border: 1px solid rgba(42, 45, 124, 0.22);
      border-radius: 999px;
      padding: 0.2rem 0.65rem;
    }
    .news-card__title {
      font-family: var(--jp);
      font-weight: 700;
      font-size: clamp(1.15rem, 1.8vw, 1.4rem);
      line-height: 1.45;
      letter-spacing: -0.005em;
      color: var(--ink);
      margin: 0;
      text-wrap: balance;
    }
    .news-card__summary {
      font-size: 0.93rem;
      line-height: 1.85;
      color: var(--ink-soft);
      margin: 0;
    }
    .news-card__cta {
      margin-top: 0.5rem;
      font-family: var(--serif);
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: var(--accent);
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      transition: color 0.2s var(--ease);
    }
    .news-card:hover .news-card__cta {
      color: var(--accent-bright);
    }

    /* Thumbnail — internal links with real image */
    .news-card__thumb {
      flex: none;
      width: 100px;
      aspect-ratio: 3 / 4;
      object-fit: cover;
      border-radius: 12px;
      background: var(--paper-soft);
      display: block;
    }
    /* Placeholder shown for external links without a thumbnail */
    .news-card__thumb-placeholder {
      flex: none;
      width: 100px;
      aspect-ratio: 3 / 4;
      border-radius: 12px;
      background: var(--paper-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      opacity: 0.38;
    }
    .news-card__body {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    @media (max-width: 720px) {
      .news-index {
        padding: 6rem var(--gutter) 4rem;
      }
      .news-card {
        flex-direction: column;
        gap: 1rem;
        padding: 1.4rem 1.5rem;
      }
      .news-card__thumb,
      .news-card__thumb-placeholder {
        width: 100%;
        aspect-ratio: 16 / 9;
      }
    }
  </style>
</head>
<body>

  <!-- Fixed nav -->
  <nav class="nav" id="nav">
    <div class="nav__inner">
      <a class="nav__brand" href="/">
        <span class="nav__mark" aria-hidden="true">
          <span class="nav__mark-bar"></span>
          <span class="nav__mark-dot"></span>
        </span>
        <span class="nav__name">TDRI</span>
      </a>
      <ul class="nav__links">
        <li><a href="/#mission">Mission</a></li>
        <li><a href="/#approach">Approach</a></li>
        <li><a href="/#works">Roadmap</a></li>
        <li><a href="/#showcase">Showcase</a></li>
        <li><a href="/#about">About</a></li>
        <li><a href="/#contact">Contact</a></li>
      </ul>
    </div>
  </nav>

  <!-- News index -->
  <main class="news-index">
    <div class="news-index__inner">

      <a class="news-index__back" href="/">Home</a>

      <p class="news-index__eyebrow">News</p>
      <h1 class="news-index__title">ニュース</h1>

      <ul class="news-list" id="news-list">
        <!-- Dynamically populated from /data/news.json -->
      </ul>

    </div>
  </main>

  <script>
  (function () {
    'use strict';
    var list = document.getElementById('news-list');

    function renderCard(item) {
      var li = document.createElement('li');
      var thumbHtml = item.thumbnail
        ? '<img class="news-card__thumb" src="' + item.thumbnail + '" alt="' + item.title + '" loading="lazy" />'
        : '<div class="news-card__thumb-placeholder" aria-hidden="true">&#128240;</div>';
      var extAttrs = item.external ? ' target="_blank" rel="noopener noreferrer"' : '';
      var cardClass = item.thumbnail ? 'news-card news-card--has-thumb' : 'news-card';
      li.innerHTML = '<a class="' + cardClass + '" href="' + item.url + '"' + extAttrs + '>'
        + thumbHtml
        + '<div class="news-card__body">'
        +   '<div class="news-card__meta">'
        +     '<span class="news-card__date">' + item.date + '</span>'
        +     '<span class="news-card__badge">' + item.badge + '</span>'
        +   '</div>'
        +   '<h2 class="news-card__title">' + item.title + '</h2>'
        +   '<p class="news-card__summary">' + item.summary + '</p>'
        +   '<span class="news-card__cta">' + item.cta + ' &rarr;</span>'
        + '</div>'
        + '</a>';
      return li;
    }

    fetch('/data/news.json')
      .then(function (res) {
        if (!res.ok) throw new Error('fetch failed: ' + res.status);
        return res.json();
      })
      .then(function (items) {
        items.forEach(function (item) {
          list.appendChild(renderCard(item));
        });
      })
      .catch(function () {
        list.innerHTML = '<li style="padding:2rem 0;color:var(--muted);font-family:var(--serif);font-size:0.9rem;">ニュースを読み込めませんでした。しばらく後にもう一度お試しください。</li>';
      });
  })();
  </script>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer__inner">
      <div class="footer__brand">
        <span class="footer__mark" aria-hidden="true">
          <span class="footer__mark-bar"></span>
          <span class="footer__mark-dot"></span>
        </span>
        <div>
          <p class="footer__name">樽石デジタル技術研究所合同会社</p>
          <p class="footer__name-en">Taruishi Digital Research Institute, LLC</p>
        </div>
      </div>
      <div class="footer__meta">
        <p class="footer__copy">
          &copy; <span id="year">2026</span> Taruishi Digital Research Institute, LLC &middot;
          This site is part of EntreprenAIs IoA platform
        </p>
        <p class="footer__legal">
          <a href="/terms/" class="footer__link">Terms of Use</a>
          &middot;
          <a href="/privacy/" class="footer__link">Privacy Policy</a>
        </p>
      </div>
    </div>
  </footer>

  <script src="/main.js" defer></script>
</body>
</html>
